# Somatriq fork CI for the sync module (fork addition — complements android.yml, it does not
# replace it: android.yml still builds the app's debug variant and runs its unit tests).
#
# What this job adds:
#   1. :sync unit tests — the journal codec, DTO contract fixtures, validators, queue, watermark.
#   2. A release-variant app assemble WITH the sync module linked in, so a drift between :sync and
#      :app (or the dependency-verification metadata) fails here, not on a contributor's phone.
#
# Release without a keystore is refused by design in app/build.gradle.kts (see the GradleException
# there); -PstagingRelease opts into the debug-keyed staging artifact instead, exactly like the
# fork's testing-build workflow. No secrets are involved.
name: Android CI (sync)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches:
      - main
      - 'somatriq/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-tests-and-release-assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run sync module unit tests
        run: ./gradlew :sync:test

      - name: Build release APK with sync linked (staging key)
        run: ./gradlew :app:assembleFullRelease -PstagingRelease

      - name: Upload APK artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: noop-full-release-staging-apk
          path: android/app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
